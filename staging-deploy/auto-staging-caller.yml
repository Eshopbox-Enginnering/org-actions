name: Deploy PR to staging

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
  statuses: read

jobs:
  deploy:
    if: github.event.issue.pull_request && github.event.comment.body == '/deploy-staging'
    uses: Eshopbox-Enginnering/org-actions/.github/workflows/reusable-staging-deploy.yml@main
    secrets: inherit
