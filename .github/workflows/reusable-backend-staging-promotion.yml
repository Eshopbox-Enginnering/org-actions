name: Central backend staging promotion

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
  statuses: read

jobs:
  promote:
    if: github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.pull_request && github.event.comment.body == '/deploy-staging'
    runs-on: self-hosted
    timeout-minutes: 90
    concurrency:
      group: backend-staging-promotion
      cancel-in-progress: false
    steps:
      - name: Checkout trusted caller repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: .staging-caller-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Checkout centrally reviewed deployment scripts
        uses: actions/checkout@v4
        with:
          repository: Eshopbox-Enginnering/org-actions
          ref: main
          path: .staging-central-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - name: Validate staging automation
        env:
          CENTRAL: .staging-central-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          node --check "$CENTRAL/staging-deploy/auto-staging-pr.cjs"
          node --test "$CENTRAL/staging-deploy/auto-staging-deploy.test.cjs" "$CENTRAL/staging-deploy/auto-staging-pr.test.cjs"
      - name: Mint staging promotion GitHub App token
        id: staging-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ORG_AGENTS_APP_ID }}
          private-key: ${{ secrets.ORG_AGENTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Validate, promote staging PR, tag and track deployment
        id: deploy
        uses: actions/github-script@v7
        env:
          STAGING_PUSH_TOKEN: ${{ steps.staging-app.outputs.token }}
          CALLER_DIR: .staging-caller-${{ github.run_id }}-${{ github.run_attempt }}
          CENTRAL_DIR: .staging-central-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const path = require('node:path');
            const central = path.join(process.env.GITHUB_WORKSPACE, process.env.CENTRAL_DIR, 'staging-deploy');
            const caller = path.join(process.env.GITHUB_WORKSPACE, process.env.CALLER_DIR);
            const { command, StagingGit } = require(path.join(central, 'auto-staging-deploy.cjs'));
            const { deploy } = require(path.join(central, 'auto-staging-pr.cjs'));
            if (!process.env.STAGING_PUSH_TOKEN) throw new Error('ORG_AGENTS_APP token required');
            const run = (file, args, options) => command(file, args, caller, options);
            const appGithub = new github.constructor({ auth: process.env.STAGING_PUSH_TOKEN });
            await deploy({ github, appGithub, context, core, command: run, git: new StagingGit(run, { useStagingApp: true }) });
      - name: Report setup error
        if: failure() && steps.deploy.outputs.reported != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Staging promotion setup failed. See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
            });
