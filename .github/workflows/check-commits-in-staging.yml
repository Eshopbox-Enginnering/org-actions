name: Check PR commits exist in staging

on:
  workflow_call:
    inputs:
      compare_branch:
        description: Branch that must already contain the commits
        required: false
        default: staging
        type: string
    outputs:
      pr_commits:
        description: "List of commits missing in compare branch"
        value: ${{ jobs.check-commits.outputs.pr_commits }}

  pull_request:
    branches:
      - main
      - master
      - Master
      - Main

jobs:
  check-commits:
    if: ${{ (github.repository != 'Eshopbox-Enginnering/org-actions') && !(startsWith(github.head_ref, 'org-action/agents-') || startsWith(github.head_ref, 'org-action/guidelines-')) }}
    runs-on: ubuntu-latest

    timeout-minutes: 10

    outputs:
      pr_commits: ${{ steps.verify.outputs.pr_commits }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: verify
        name: Verify all PR commits exist in compare branch
        env:
          BASE: ${{ github.base_ref }}
          SOURCE: ${{ github.event.pull_request.head.ref }}
          COMPARE: ${{ inputs.compare_branch || 'staging' }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Event: ${{ github.event_name }}"
          echo "Base: ${BASE:-}"
          echo "Source: ${SOURCE:-}"
          echo "Compare: ${COMPARE}"

          # Only applicable for PRs targeting main/master.
          # This protects against the workflow being called from another
          # workflow for a staging PR.
          if [[ "${BASE:-}" != "main" &&
                "${BASE:-}" != "master" &&
                "${BASE:-}" != "Main" &&
                "${BASE:-}" != "Master" ]]; then
            echo "Skipping check: base branch '${BASE:-unknown}' is not main/master."
            exit 0
          fi

          # Skip check for revert branches
          if [[ -n "${SOURCE:-}" && "${SOURCE,,}" == *revert* ]]; then
            echo "Skipping staging commit verification for revert branch: $SOURCE"
            exit 0
          fi

          git fetch origin "$COMPARE" --quiet

          if [[ -n "${SOURCE:-}" ]]; then
            git fetch origin "$SOURCE" --quiet
          else
            echo "::error::Unable to determine PR source branch."
            exit 1
          fi

          # Central guideline rollouts use an independent production commit.
          # Allow it only after exactly those docs are already in staging.
          if [[ "${SOURCE:-}" == org-action/guidelines-prod-* ]]; then
            git fetch origin "$BASE" --quiet
            # Verify the prospective merge, not just the source branch.
            # If main moved since PR creation, merging can combine edits
            # into content that differs from staging. Fail closed until the
            # production branch is updated from the latest main.
            if ! git merge-base --is-ancestor "origin/$BASE" "origin/$SOURCE"; then
              echo "Guideline production PR is behind $BASE; normal commit check applies."
              docs_only=false
            else
              docs_only=true
            fi
            mapfile -t PR_FILES < <(git diff --name-only "origin/$BASE...origin/$SOURCE")
            if [[ "${#PR_FILES[@]}" -gt 0 ]]; then
              for path in "${PR_FILES[@]}"; do
                if [[ ! "$path" =~ ^docs/engineering-guidelines/[A-Za-z0-9_.-]+\.md$ ]] ||
                   ! git cat-file -e "origin/$COMPARE:$path" 2>/dev/null ||
                   ! git diff --quiet "origin/$COMPARE" "origin/$SOURCE" -- "$path"; then
                  docs_only=false
                  break
                fi
              done
              if [[ "$docs_only" == true ]]; then
                echo "Verified docs-only rollout: all PR files match staging."
                exit 0
              fi
            fi
            echo "Guideline rollout failed staged-file verification; enforcing normal commit check."
          fi

          # Ignore merge commits.
          # Find commits present in source branch but missing from compare branch.
          PR_COMMITS=$(
            git rev-list \
              --no-merges \
              "origin/${COMPARE}..origin/${SOURCE}" \
              | grep -v '^$' || true
          )

          echo "Non-merge commits in PR source branch not in $COMPARE:"
          echo "$PR_COMMITS"

          if [[ -n "${PR_COMMITS:-}" ]]; then
            echo "::error::The following non-merge commits are not in ${COMPARE}:"

            while IFS= read -r commit; do
              [[ -z "$commit" ]] && continue

              SHORT_SHA="${commit:0:7}"
              URL="https://github.com/$REPO/commit/$commit"

              echo "::error file=Commit::$SHORT_SHA::${SHORT_SHA} missing in $COMPARE -> $URL"
            done <<< "$PR_COMMITS"

            {
              echo "pr_commits<<EOF"
              echo "$PR_COMMITS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

            exit 1
          fi

          echo "All relevant non-merge PR commits are already in ${COMPARE}."
