name: Central deploy PR to staging

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
  statuses: read

jobs:
  deploy:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/deploy-staging'
    runs-on: self-hosted
    timeout-minutes: 90
    concurrency:
      group: auto-staging-deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout destination repository for Git operations
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: .auto-staging-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Mint destination-scoped staging token
        id: staging-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ORG_AGENTS_APP_ID }}
          private-key: ${{ secrets.ORG_AGENTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Mint central repository read token
        id: central-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ORG_AGENTS_APP_ID }}
          private-key: ${{ secrets.ORG_AGENTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: org-actions
          permission-contents: read

      - name: Checkout centrally maintained and protected scripts
        uses: actions/checkout@v4
        with:
          repository: Eshopbox-Enginnering/org-actions
          ref: main
          token: ${{ steps.central-app.outputs.token }}
          persist-credentials: false
          path: .central-staging-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate central deployment scripts
        working-directory: .central-staging-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node --check staging-deploy/auto-staging-pr.cjs
          node --check staging-deploy/auto-staging-deploy.cjs
          node --test staging-deploy/auto-staging-deploy.test.cjs staging-deploy/auto-staging-pr.test.cjs

      - name: Check gates, promote and report deployment
        id: deploy
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_PUSH_TOKEN: ${{ steps.staging-app.outputs.token }}
          TARGET_DIRECTORY: .auto-staging-${{ github.run_id }}-${{ github.run_attempt }}
          CENTRAL_DIRECTORY: .central-staging-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const path = require('node:path');
            const workspace = process.env.GITHUB_WORKSPACE;
            const target = path.join(workspace, process.env.TARGET_DIRECTORY);
            const central = path.join(workspace, process.env.CENTRAL_DIRECTORY, 'staging-deploy');
            const { command, StagingGit } = require(path.join(central, 'auto-staging-deploy.cjs'));
            const { deploy } = require(path.join(central, 'auto-staging-pr.cjs'));
            const run = (file, args, options) => command(file, args, target, options);
            if (!process.env.STAGING_PUSH_TOKEN) throw new Error('Destination GitHub App token is required.');
            const appGithub = new github.constructor({ auth: process.env.STAGING_PUSH_TOKEN });
            await deploy({ github, appGithub, context, core, command: run, git: new StagingGit(run, { useStagingApp: true }) });

      - name: Report workflow setup failure
        if: failure() && steps.deploy.outputs.reported != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Staging deployment stopped: setup or workflow execution failed. See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
            });

      - name: Clean up isolated checkouts
        if: always()
        shell: bash
        run: |
          rm -rf -- ".auto-staging-${{ github.run_id }}-${{ github.run_attempt }}" ".central-staging-${{ github.run_id }}-${{ github.run_attempt }}"
