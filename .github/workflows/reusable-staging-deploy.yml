name: Central PR staging deployment

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
  statuses: read

jobs:
  acknowledge:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request &&
      (github.event.comment.body == '/deploy-staging' ||
       startsWith(github.event.comment.body, '/force-deploy-staging'))
    runs-on:
      group: checks-runners
      labels: checks-runner
    outputs:
      comment_id: ${{ steps.ack.outputs.comment_id }}
    steps:
      - name: Acknowledge staging command immediately
        id: ack
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '<!-- central-staging-deploy:v1 -->',
              `<!-- central-staging-run:${context.runId} -->`,
              '## 🚀 Staging deployment',
              '**Status:** ⏳ Command received; preparing deployment',
              '',
              '| Step | Result |',
              '|---|---|',
              '| Authorization & review | ⏳ Waiting |',
              '| Required checks | ⏳ Waiting |',
              '| Staging PR | ⏳ Waiting |',
              '| Tag & CI/CD | ⏳ Waiting |',
              '',
              `**Workflow run:** [View execution](${url})`
            ].join('\\n');
            const response = await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body
            });
            core.setOutput('comment_id', String(response.data.id));

  deploy:
    needs: acknowledge
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request &&
      (github.event.comment.body == '/deploy-staging' ||
       startsWith(github.event.comment.body, '/force-deploy-staging'))
    runs-on: self-hosted
    timeout-minutes: 120
    concurrency:
      group: central-staging-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted target repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: .central-deploy-target

      - name: Mint read-only central source token
        id: source-reader
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ORG_AGENTS_APP_ID }}
          private-key: ${{ secrets.ORG_AGENTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: org-actions
          permission-contents: read

      # Read central implementation from protected org-actions/main, so backend
      # callers do not need updating for each reviewed central change.
      - name: Checkout reviewed common automation
        uses: actions/checkout@v4
        with:
          repository: Eshopbox-Enginnering/org-actions
          ref: main
          token: ${{ steps.source-reader.outputs.token }}
          persist-credentials: false
          path: .central-deploy-code

      # Reuse the App already proven to work for organization-wide PR operations.
      # Scope this token to the caller repository; no new credentials needed.
      - name: Mint target-repository App token
        uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.ORG_AGENTS_APP_ID }}
          private-key: ${{ secrets.ORG_AGENTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Validate, promote through staging PR and report
        uses: actions/github-script@v7
        id: deploy
        env:
          STAGING_ACK_COMMENT_ID: ${{ needs.acknowledge.outputs.comment_id }}
          GH_TOKEN: ${{ github.token }}
          STAGING_PUSH_TOKEN: ${{ steps.app.outputs.token }}
          STAGING_DEPLOY_APP_TOKEN: ${{ steps.app.outputs.token }}
          DEPLOY_DIRECTORY: .central-deploy-target
          FORCE_DEPLOY_USERS: ${{ vars.FORCE_DEPLOY_USERS }}
        with:
          script: |
            const path = require('node:path');
            const root = process.env.GITHUB_WORKSPACE;
            const {deploy, command} = require(path.join(root, '.central-deploy-code/staging-deploy/auto-staging-deploy.cjs'));
            const {StagingPR} = require(path.join(root, '.central-deploy-code/staging-deploy/staging-pr.cjs'));
            // actions/github-script supplies an authenticated Octokit instance;
            // reuse its constructor instead of importing an unavailable module.
            const app = new github.constructor({auth: process.env.STAGING_DEPLOY_APP_TOKEN});
            const caller = github;
            const cwd = path.join(root, process.env.DEPLOY_DIRECTORY);
            const run = (file, args, options) => command(file, args, cwd, options);
            const git = new StagingPR(run, app, caller, context.repo);
            await deploy({github: caller, context, core, git, command:run});

      - name: Report workflow initialization failure
        if: failure() && steps.deploy.outputs.reported != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            if (!context.issue.number) return;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: '❌ **Staging deployment could not initialize.** Check the GitHub Actions run and App credentials: ' +
                context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
                '/actions/runs/' + context.runId
            });

      - name: Remove isolated checkouts
        if: always()
        shell: bash
        run: rm -rf -- .central-deploy-code .central-deploy-target
