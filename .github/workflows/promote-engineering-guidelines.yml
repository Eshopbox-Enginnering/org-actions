name: Promote Merged Engineering Guidelines

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/promote-engineering-guidelines.yml'
      - 'scripts/sync-engineering-guidelines.py'
      - 'scripts/reconcile-guideline-promotions.py'
      - 'tests/test_*guideline*.py'

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('engineering-guidelines-pr-test-{0}', github.run_id) || 'engineering-guidelines-rollout' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run guideline tests
        run: |
          python3 -m py_compile scripts/sync-engineering-guidelines.py scripts/reconcile-guideline-promotions.py
          python3 -m unittest discover -s tests -p 'test_*guideline*.py' -v

  promote:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: agents-org-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ORG_AGENTS_APP_ID }}
          private-key: ${{ secrets.ORG_AGENTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Configure Git auth
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh auth setup-git
      - name: Create production PRs for merged staging guidelines
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: python3 scripts/reconcile-guideline-promotions.py
